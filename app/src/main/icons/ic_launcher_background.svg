<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
    <defs>
        <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#BE90EE" />
            <stop offset="1" stop-color="#976CDD" />
        </linearGradient>
        <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9765E7" />
            <stop offset="1" stop-color="#533ACC" />
        </linearGradient>
        <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="white" stop-opacity="0" />
            <stop offset="1" stop-color="white" />
        </linearGradient>
        <mask id="horizontalBlend">
            <rect width="108" height="108" fill="url(#blend)" />
        </mask>
    </defs>
    <rect width="108" height="108" fill="url(#left)" />
    <rect width="108" height="108" fill="url(#right)" mask="url(#horizontalBlend)" />
</svg>
